# Men-deploy website statis ke GitHub Pages setiap ada push ke main
# (atau dijalankan manual lewat tab Actions).
# Sekali saja, pemilik repo harus mengaktifkan Pages: Settings → Pages →
# Source: "GitHub Actions". Token bawaan Actions tidak berwenang membuat
# situs Pages sendiri.
name: Deploy website ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Hanya berkas situs yang ditayangkan; SOP admin (ops/), alat bantu (tools/), laporan, dan
      # berkas repo lain tidak ikut diunggah ke alamat publik.
      - name: Siapkan folder situs
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'ops' --exclude 'tools' \
            --exclude 'reports' --exclude 'research_notes' --exclude 'finance' --exclude 'dist' \
            --exclude 'README.md' --exclude '.gitignore' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
